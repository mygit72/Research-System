name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,worker]"
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Unit + API tests (SQLite)
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://research:research@localhost:5432/research
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: PostgreSQL full-text retriever
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://research:research@localhost:5432/research
        run: pytest -q tests/test_postgres_fts.py
      - name: Dependency audit (known vulnerabilities)
        run: |
          pip install pip-audit "setuptools>=83"
          pip-audit --skip-editable --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (known vulnerabilities)
        run: npm audit --audit-level=high

  e2e:
    # Upload → ask → verify citations in a real browser, against the production build
    # (with its Content-Security-Policy) and an API with deterministic models.
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,worker]"
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          CI: "1"
          E2E_PYTHON: python
      - name: A public site with the shared free model
        run: npx playwright test -c playwright.free.config.ts
        working-directory: frontend
        env:
          CI: "1"
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: frontend/test-results/

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
