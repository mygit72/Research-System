# Production Nginx Configuration for Research Intelligence
# Handles reverse-proxying, SSE streaming, large uploads, and security hardening.

# Access log format leaves out query strings: protects search terms, filters, and asset signatures
log_format no_query '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent $request_time "$http_referer"';

# Upstream backend API
upstream backend_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;
    error_log /var/log/nginx/error.log warn;

    # Global upload limit (matches or exceeds MAX_UPLOAD_SIZE_MB=50)
    client_max_body_size 100m;

    # Security headers
    include /etc/nginx/security-headers.conf;

    # 1. Bulk Paper ZIP Import endpoint: permits up to 200 MB
    location = /api/v1/documents/import/zip {
        client_max_body_size 200m;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 2. Server-Sent Events (SSE) & General API
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for SSE: disable response buffering so tokens stream in real time
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 3. Health check endpoints
    location ~ ^/(health|ready)$ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
        access_log off;
    }

    # 4. Strictly block internal metrics from public access
    location /metrics {
        deny all;
        return 404;
    }

    # 5. Fingerprinted static assets: cache 1 year immutably
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # 6. SPA fallback for frontend routes
    location / {
        try_files $uri /index.html;
    }
}

