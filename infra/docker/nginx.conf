# The access log leaves out query strings: what people type into filter and search boxes
# travels in them (?q=...), and so do the signatures of file links. The path, status, size and
# timing remain. ($uri is the path without the query; nginx's default format logs $request.)
log_format no_query '$remote_addr [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    access_log /var/log/nginx/access.log no_query;

    client_max_body_size 100m;  # keep >= MAX_UPLOAD_SIZE_MB

    # Security headers (kept in one file: a location with its own add_header would drop them).
    include /etc/nginx/security-headers.conf;

    # A folder of papers as one .zip (MAX_ZIP_SIZE_MB): only this route may exceed the global limit.
    location = /api/v1/documents/import/zip {
        client_max_body_size 200m;  # keep >= MAX_ZIP_SIZE_MB
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;  # unpacking and queueing a hundred papers takes a while
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (streaming answers) must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://backend:8000;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
